name: Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent version tag, for example v2.0.1
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release-agent:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      CGO_ENABLED: '0'
      AGENT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Validate immutable release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AGENT_VERSION_TAG_PATH="$(node ../scripts/verify-release-assets.mjs --version-path "$AGENT_VERSION")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/${AGENT_VERSION}" >/dev/null; then
            echo "Version ${AGENT_VERSION} already has a tag. Choose a new version; existing assets are immutable." >&2
            exit 1
          else
            tag_status=$?
            if [ "$tag_status" -ne 2 ]; then exit "$tag_status"; fi
          fi
          # List succeeds even when the version does not exist, and fails closed
          # on authentication/network errors. Draft releases count as used too.
          existing_releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r release_tag; do
            if [ "$release_tag" = "$AGENT_VERSION" ]; then
              echo "Version ${AGENT_VERSION} already has a release. Choose a new version." >&2
              exit 1
            fi
          done <<< "$existing_releases"
          echo "AGENT_VERSION_TAG=${AGENT_VERSION}" >> "$GITHUB_ENV"
          echo "AGENT_VERSION_TAG_PATH=${AGENT_VERSION_TAG_PATH}" >> "$GITHUB_ENV"

      - name: Build agent binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          agent_version="${AGENT_VERSION}"
          node ../scripts/verify-release-assets.mjs --version-path "$agent_version" >/dev/null
          echo "AGENT_VERSION=${agent_version}" >> "$GITHUB_ENV"
          echo "AGENT_VERSION_TAG=${agent_version}" >> "$GITHUB_ENV"
          ldflags="-s -w -X main.Version=${agent_version}"
          echo "Embedding agent version ${agent_version}"

          build() {
            local goos="$1"
            local goarch="$2"
            local output="$3"
            echo "Building ${output}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "dist/${output}" .
          }

          build linux amd64 cf-vps-monitor-agent-linux-amd64
          build linux arm64 cf-vps-monitor-agent-linux-arm64
          build darwin amd64 cf-vps-monitor-agent-darwin-amd64
          build darwin arm64 cf-vps-monitor-agent-darwin-arm64
          build freebsd amd64 cf-vps-monitor-agent-freebsd-amd64
          build windows amd64 cf-vps-monitor-agent-windows-amd64.exe
          cp install.sh dist/install.sh
          cp install-linux.sh dist/install-linux.sh
          cp install-windows.ps1 dist/install-windows.ps1
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Generate artifact provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: agent/dist/*

      - name: Create release tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$AGENT_VERSION_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${AGENT_VERSION_TAG}"

      - name: Publish immutable agent release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="$(git ls-remote --exit-code --tags origin "refs/tags/${AGENT_VERSION_TAG}")"
          test "${tag_ref%%[[:space:]]*}" = "$GITHUB_SHA"
          release_notes="${RUNNER_TEMP}/agent-release-notes.txt"
          release_metadata="${RUNNER_TEMP}/agent-release-metadata.json"
          printf 'Immutable release for %s@%s.\nArtifacts include GitHub artifact attestations.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$release_notes"
          gh release create "$AGENT_VERSION_TAG" \
            --verify-tag --target "$GITHUB_SHA" --draft \
            --title "CF VPS Monitor Agent ${AGENT_VERSION}" \
            --notes-file "$release_notes" --repo "$GITHUB_REPOSITORY"
          gh release upload "$AGENT_VERSION_TAG" dist/* --repo "$GITHUB_REPOSITORY"
          # The tag endpoint returns published releases. Resolve this draft's ID
          # through the CLI, then read its assets without publishing it early.
          release_id="$(gh release view "$AGENT_VERSION_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          case "$release_id" in ''|*[!0-9]*) echo "Invalid draft release ID" >&2; exit 1 ;; esac
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release_metadata"
          node ../scripts/verify-release-assets.mjs "$AGENT_VERSION_TAG" "$GITHUB_SHA" dist "$release_metadata"
          gh release edit "$AGENT_VERSION_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Verify published releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$AGENT_VERSION_TAG" --repo "$GITHUB_REPOSITORY"
          git ls-remote --exit-code --tags origin "refs/tags/${AGENT_VERSION_TAG}"
